<body>
    <h1>函式Function</h1>
    <script>
        //創建函式
        function createBMI() {
            const height = 170;
            const weight = 70;
            const BMI = (weight / (height / 100) ** 2).toFixed(2);
            switch (true) {
                case BMI <= 18.5: state = '過輕'; break;
                case 18.5 < BMI && BMI < 24.9: state = '正常'; break;
                case 25 < BMI && BMI < 29.9: state = '過重'; break;
                default: state = '過胖'; break;
            }
            console.log(`身高${height}cm，體重${weight}kg，體重狀態${state}`);
        }

        //呼叫函示
        createBMI();

        //迴圈呼叫函式
        for (c = 0; c < 3; c++) {
            createBMI();
        }

                return `請正確輸入 ${userName} 身高體重`
