<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制迴圈</title>
</head>

<body>
    <h1>控制迴圈</h1>
    <script>
        //透過continue(跳過)，break(破壞) 來控制迴圈
        for (let num = 0; num < 10; num++) {

            if (num === 5) continue; //跳過5
            if (num === 7) break; //遇7直接結束這迴圈
            console.log(num);
        }
    </script>

    <h2>巢狀迴圈</h2>
    <script>
        console.clear();
        //九九乘法表
        let result = '';
        for (let num = 2; num <= 9; num++) {
            for (let i = 1; i <= 9; i++) {
                result += `${num} x ${i} = ${num * i}\n`
            }
            result += '-----------------\n';
        } //雙迴圈
        console.log(result);
    </script>

    <h3>練習</h3>
    <script>
        console.clear();
        // 使用 for 迴圈印出 1 到 100 
        // let res = '';
        for (let count = 1; count <= 100; count++) {
            console.log(count);
        }

        // 使用 while 迴圈計算 1 到 100 的總和
        let sum = 0
        let num = 0
        while (num <= 100) {
            sum += num;
            num++;
        }
        console.log(sum);

        // 使用巢狀迴圈印出一個 5×5 的星號方陣
        console.clear();
        let resultstar = '';
        for (let j = 0; j < 5; j++) {
            for (let i = 0; i < 5; i++) { resultstar += '★' };
            resultstar += '\n';
        }
        console.log(resultstar);

        //第2示範
        let resultstar2 = '';
        for (let i = 0; i < 25; i++) {
            resultstar2 += '★';
            if ((i + 1) % 5 === 0) resultstar2 += '\n';
        }
        console.log(resultstar2);

        //第3示範
        let result3 = '';
        for (let j = 2, i = 1; j * i <= 81; i++) {
            result3 += `${j} x ${i} = ${j * i}\n`;
            //ex:j=2, i=9
            if (i === 9) {
                if (i === 9 && j === 9) break;

                result3 += '-------------------\n'
                j++;
                i = 0;
            }
        }
        console.log(result3);
    </script>
</body>

</html>
