<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math</title>
</head>

<body>
    <h1>Math</h1>
    <script>
        //圓周率
        console.log(Math.PI);

        //自然對數的底數 
        console.log(Math.E);

        //絕對值
        console.log(Math.abs(-5));

        //無條件進位
        console.log(Math.ceil(4.2)); //等於5

        //無條件捨去
        console.log(Math.floor(4.8)); //等於4

        //四捨五入
        console.log(Math.round(4.5));
        console.log(Math.round(4.2));

        //最大值
        console.log(Math.max(1, 5, 3));

        //最小值
        console.log(Math.min(1, 5, 3));

        //次方
        console.log(Math.pow(2, 3));

        //平方根
        console.log(Math.sqrt(16));

        //隨機數，會回傳一個0~1的浮點數
        console.log(Math.random());
        console.log(Math.random() * 10); //會回傳一個0~9的浮點數
        console.log(Math.random() * 10) + 1; //1~10

        //練習規劃一個fn，傳入min max，回傳一個min~max間的整數
    </script>
</body>

</html>
