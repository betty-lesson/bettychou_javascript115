<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--點擊事件-->
    <button onclick="showMessage(this, event)">點擊我</button>
    <!--改變value
    this代表此段程式碼
    <input type="text" name="acc" onchange="handleChange(this.value)">-->
    <input type="text" name="acc" onchange="handleChange(event.target.value)">
    <hr>
    <button id="eventListen">點擊我2</button>
    <input type="text" name="pwd">
</body>

<script>
    let count = 0;
    function showMessage(who, event) {
        console.log(who);
        console.log(event);
        count++;
        console.log("按鈕被點擊了！", count);
    }

    function handleChange(val) {
        console.log(val);
        console.log(document.querySelector('input[name=acc]').value);
        //console.log("輸入值改變為：" + value);
    }

    //------------------------------------------
    document.querySelector('[name=pwd]').onchange = function (e) {
        console.log(e.target.value);
    };

    //建議------------------------------------
    /*document.querySelector('#eventListen').addEventListener('click', (e) => {
        console.log(e.target);
    });*/
    const heyClick = (e) => {
        console.log('hey', e.target);
    }

    document.querySelector('#eventListen').addEventListener('click', heyClick);
    document.querySelector('#eventListen').addEventListener('click', (e) => {
        console.log('hello', e.target);
    });

    //取消事件
    document.querySelector('[name=pwd]').addEventListener.onchange = null;
    document.querySelector('#eventListen').removeEventListener('click', heyClick);

</script>

</html>
