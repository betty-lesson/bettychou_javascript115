<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="handleClick(event)">點擊我</button>
    <input type="text" onchange="handleChange(event)">
    <!--偵測按鍵-->
    <input type="text" onkeydown="handleKeyDown(event)">
    <a href="https://example.com" onclick="handleLink(event)">前往外部連結（阻止跳轉）</a>
    <hr>
    <div id="keyIn" style="word-wrap:break-word"></div>
</body>

<script>
    // HTML 屬性方式需要手動傳遞 event 參數
    function handleClick(event) {
        console.log("事件類型：" + event.type); //click
        console.log("目標元素：" + event.target.tagName); //button
        console.log("滑鼠位置：" + event.clientX + ", " + event.clientY); //座標
        console.log("是否按下 Ctrl：" + event.ctrlKey); //false
        console.log("是否按下 Shift：" + event.shiftKey); //false
        console.log("是否按下 Alt：" + event.altKey); //false
    }

    function handleChange(event) {
        console.log("輸入值：" + event.target.value);
        console.log("事件類型：" + event.type);
    }

    let keyIn = '';

    function handleKeyDown(event) {
        /*console.log("按下的鍵：" + event.key);
        console.log("鍵碼：" + event.keyCode);*/

        if (event.key === 'Backspace') {
            keyIn = keyIn.slice(0, -1);
        } else if (
            (event.keyCode >= 48 && event.keyCode <= 57) || //數字0-9
            (event.keyCode >= 65 && event.keyCode <= 90) || //英文字母A-Z
            (event.keyCode >= 97 && event.keyCode <= 122) //英文字母a-z
        ) {
            event.preventDefault(); // 阻止預設行為（避免輸入到 input 中）
        } else {
            keyIn += event.key;
        }
        document.querySelector('#keyIn').innerHTML = keyIn;

        // 阻止 Enter 鍵的預設行為（例如避免表單提交）
        if (event.key === 'Tab') {
            event.preventDefault();
            console.log("已阻止 Tab 鍵的預設行為（離開此框）");
        }
    }

    function handleLink(event) {
        event.preventDefault();
        console.log("已阻止連結跳轉，改為執行自訂邏輯（例如開啟 modal）");
    }
</script>

</html>
